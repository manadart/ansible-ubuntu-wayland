##### STATUS BAR #####

set -g status-keys vi
set -g status-interval 1

# 'status-style bright' is not a valid style in modern tmux; use explicit fg/bg.
set -g status-style fg=white,bg=colour234

set -g status-left-length 20
set -g status-left '#[fg=red] #S#[default]'
set -g status-justify centre
set -g status-right '#[fg=green]%H:%M:%S #[default]'

setw -g window-status-current-format '#[fg=yellow]#I.#P#F#W#[default]'
setw -g window-status-format '#I#F#W'

# Start at 1 for congruence with Xmonad.
set -g base-index 1
setw -g pane-base-index 1


##### ENVIRONMENT (Wayland/Sway) #####
# Ensure tmux updates these from the attaching client (fixes missing WAYLAND_DISPLAY/SWAYSOCK inside tmux).
set -g update-environment "DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_RUNTIME_DIR XDG_SESSION_TYPE DBUS_SESSION_BUS_ADDRESS SSH_AUTH_SOCK"


##### KEY BINDINGS #####

unbind C-b
set -g prefix C-Space

# Your binds: keep as-is
bind Space copy-mode
bind C-Space copy-mode

bind '\' split-window -h
bind - split-window -v


##### COPY / PASTE #####
# Use 'y' in copy mode to copy selection. Prefer wl-copy on Wayland; fallback to xclip if available.
# Requires: wl-clipboard (wl-copy) on Wayland; xclip for X11.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'sh -c "command -v wl-copy >/dev/null 2>&1 && wl-copy || xclip -in -selection clipboard"'


##### BASIC CONFIG #####

setw -g mode-keys vi
set -g mouse on

set -g history-limit 50000
set -s escape-time 30

set -g xterm-keys on


##### OPTIONAL: better color handling (uncomment if you use a truecolor terminal) #####
